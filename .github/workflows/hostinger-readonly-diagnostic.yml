name: Read-only Hostinger path diagnostic (QVM)

# Safe discovery only. Does not write, delete, or deploy.
# Uses dedicated QVM SSH key from environment Hostinger-ReadOnly.
# Verified endpoint: 92.113.28.62:65002 as u359614291
# Verified QVM root: /home/u359614291/domains/quantumvisamanager.com/public_html
# Explicitly rejects Ledgerline root.

on:
  workflow_dispatch:
    inputs:
      expected_host_key_fingerprint:
        description: SHA256 fingerprint verified before dispatch (format SHA256:...)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-diagnostic-qvm
  cancel-in-progress: false

jobs:
  discover:
    name: Read-only SSH discovery (QVM root only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Hostinger-ReadOnly
    steps:
      - name: Validate approved QVM connection details (no secret values printed)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ inputs.expected_host_key_fingerprint }}
        run: |
          set -euo pipefail
          readonly EXPECTED_HOST='92.113.28.62'
          readonly EXPECTED_PORT='65002'
          readonly EXPECTED_USER='u359614291'
          for name in HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USERNAME HOSTINGER_SSH_KEY; do
            [[ -n "${!name:-}" ]] || { echo "Missing Hostinger-ReadOnly secret: $name"; exit 1; }
          done
          [[ "$HOSTINGER_HOST" == "$EXPECTED_HOST" ]]
          [[ "$HOSTINGER_PORT" == "$EXPECTED_PORT" ]]
          [[ "$HOSTINGER_USERNAME" == "$EXPECTED_USER" ]]
          [[ "$EXPECTED_HOST_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          echo "Approved QVM endpoint details and dedicated SSH key are present. Secret values are not printed."

      - name: Pin the Hostinger SSH host key (strict verification)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ inputs.expected_host_key_fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          ssh-keyscan -T 10 -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" > "$RUNNER_TEMP/scanned-host-keys"
          : > "$RUNNER_TEMP/hostinger_known_hosts"
          matched=0
          while read -r scanned_host key_type key_data; do
            [[ -n "${key_data:-}" ]] || continue
            printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" > "$RUNNER_TEMP/candidate-host-key"
            fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/candidate-host-key" -E sha256 | awk '{print $2}')"
            if [[ "$fingerprint" == "$EXPECTED_HOST_KEY_FINGERPRINT" ]]; then
              printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" >> "$RUNNER_TEMP/hostinger_known_hosts"
              matched=1
            fi
          done < "$RUNNER_TEMP/scanned-host-keys"
          if [[ "$matched" != 1 ]]; then
            echo "No scanned host key matched the fingerprint supplied. No SSH connection was made."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/hostinger_known_hosts"
          echo "Host key matched the supplied fingerprint."

      - name: Verify QVM document root and reject Ledgerline (read-only)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/hostinger_key"
          trap 'rm -f "$key_file" "$RUNNER_TEMP/hostinger_known_hosts" "$RUNNER_TEMP/candidate-host-key" "$RUNNER_TEMP/scanned-host-keys"' EXIT
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hostinger_known_hosts" -o ConnectTimeout=15 -i "$key_file" -p "$HOSTINGER_PORT")
          ssh "${SSH_OPTS[@]}" "$HOSTINGER_USERNAME@$HOSTINGER_HOST" 'bash -s' <<'REMOTE_READ_ONLY'
          set -euo pipefail
          expected_target='/home/u359614291/domains/quantumvisamanager.com/public_html'
          forbidden_ledgerline='/home/u359614291/domains/quantumledgerline.com/public_html'
          resolved_home="$(readlink -f -- "$HOME")"
          target="$(realpath -e -- "$expected_target")"
          forbidden="$(realpath -e -- "$forbidden_ledgerline")"
          test "$target" = "$expected_target"
          test "$target" = "$resolved_home/domains/quantumvisamanager.com/public_html"
          test "$target" != "$forbidden"
          case "$target" in
            *quantumledgerline.com*|*quantumledgerlink.com*) exit 1 ;;
          esac
          test -d "$target"
          test -r "$target"
          test -w "$target"
          # Empty/new site may contain only Hostinger default.php
          entry_count="$(find "$target" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          perms="$(stat -c '%a' -- "$target")"
          has_default=no
          [[ -f "$target/default.php" ]] && has_default=yes
          echo "qvm_target_ok=yes"
          echo "qvm_target_permissions=${perms}"
          echo "qvm_target_writable=yes"
          echo "qvm_entry_count=${entry_count}"
          echo "qvm_has_default_php=${has_default}"
          echo "ledgerline_root_rejected=yes"
          echo "backup_dir_expected=\$HOME/deployment_backups/qvm-production"
          REMOTE_READ_ONLY
